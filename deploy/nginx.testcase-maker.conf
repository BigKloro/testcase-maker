# /etc/nginx/sites-available/testcase-maker  ->  ln -s into sites-enabled, then `nginx -t && systemctl reload nginx`.
# Run `certbot --nginx -d testcase.example.com` afterwards; it rewrites this file with the 443 block.
# UFW already allows 'Nginx Full' for the other project; nothing else to open (the API binds to 127.0.0.1 only).

# Generation costs real Claude tokens. 6 generate/regenerate calls per minute per IP, small burst.
limit_req_zone $binary_remote_addr zone=tcm_llm:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name testcase.example.com;   # CHANGE ME

    root /var/www/testcase-maker/frontend/dist;
    index index.html;
    client_max_body_size 2m;

    location / {
        try_files $uri /index.html;
    }

    location ~ ^/api/v1/(generate|regenerate-case)$ {
        limit_req zone=tcm_llm burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
